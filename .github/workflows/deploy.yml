name: Deploy mockups to GitHub Pages

on:
  push:
    branches: [claude/b2b-distributor-order-ui-89h4aw]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published
# Pages site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
        env:
          # playwright is only used by the local screenshot harness; CI has no
          # need for ~400MB of browsers to build a static site.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - run: npm run build

      # This repo's Pages source was "deploy from a branch", so every push also
      # kicked a Jekyll build of the repo root. That publishes the unbuilt Vite
      # template (`<script src="/src/main.jsx">`, i.e. a blank page) and races
      # our artifact deploy — whichever finishes last wins. configure-pages
      # only enables Pages when it is off, so it never cleared this. Set the
      # build type explicitly; `pages: write` is enough, and it is idempotent.
      - name: Force the Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow \
            || gh api -X POST "repos/${{ github.repository }}/pages" -f build_type=workflow
          echo "Pages build_type is now: $(gh api "repos/${{ github.repository }}/pages" --jq .build_type)"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A green deploy only proves the artifact was accepted. If the Pages source is
  # still "deploy from a branch", the branch build publishes the repo root over
  # it and the URL serves the unbuilt dev template. Assert what is actually served.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Assert the live URL serves the built app
        run: |
          URL="https://sammyq724.github.io/MVP_SUPPLAI/"
          for i in $(seq 1 10); do
            BODY=$(curl -sSL --max-time 30 "$URL" || true)
            if printf '%s' "$BODY" | grep -q '/MVP_SUPPLAI/assets/index-.*\.js'; then
              echo "OK — serving the built bundle:"
              printf '%s' "$BODY" | grep -o '/MVP_SUPPLAI/assets/[^"]*'
              exit 0
            fi
            echo "attempt $i: not the built app yet, waiting..."
            sleep 20
          done
          echo "::error::$URL is not serving the built app."
          echo "----- what it actually returns -----"
          printf '%s' "$BODY" | head -40
          echo "------------------------------------"
          echo "::error::Set Settings → Pages → Source to 'GitHub Actions'."
          exit 1
