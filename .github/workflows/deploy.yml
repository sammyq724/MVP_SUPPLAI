name: Deploy mockups to GitHub Pages

on:
  push:
    branches: [claude/b2b-distributor-order-ui-89h4aw]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # to see whether the branch Pages build is still running

# Let a running deploy finish rather than cancelling it — a half-published
# Pages site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
        env:
          # playwright is only used by the local screenshot harness; CI has no
          # need for ~400MB of browsers to build a static site.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - run: npm run build

      # Best effort: if the Pages source is still "deploy from a branch", flip it
      # to Actions so the branch build stops racing us. The default GITHUB_TOKEN
      # is usually refused here (changing the source needs admin scope), so this
      # must not fail the run — the deploy job orders around the race instead.
      - name: Try to set the Pages source to GitHub Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow \
            && echo "Pages source set to GitHub Actions." \
            || echo "Could not change the Pages source (needs admin scope); relying on deploy ordering."

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # With a branch-sourced Pages site, each push also starts a Jekyll build
      # of the repo root that publishes the unbuilt Vite template. Both it and
      # our artifact publish to the same site and the last writer wins, so wait
      # for it to finish before deploying rather than racing it.
      - name: Wait out the branch Pages build for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            IN_FLIGHT=$(gh api \
              "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=100" \
              --jq '[.workflow_runs[]
                     | select(.path == "dynamic/pages/pages-build-deployment")
                     | select(.status != "completed")] | length')
            if [ "$IN_FLIGHT" = "0" ]; then
              echo "No branch Pages build in flight — deploying."
              exit 0
            fi
            echo "attempt $i: $IN_FLIGHT branch Pages build(s) still running, waiting..."
            sleep 10
          done
          echo "::warning::Branch Pages build did not finish in time; deploying anyway."

      - id: deployment
        uses: actions/deploy-pages@v4

  # A green deploy only proves the artifact was accepted. If the Pages source is
  # still "deploy from a branch", the branch build publishes the repo root over
  # it and the URL serves the unbuilt dev template. Assert what is actually served.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Assert the live URL serves the built app
        run: |
          URL="https://sammyq724.github.io/MVP_SUPPLAI/"
          for i in $(seq 1 10); do
            BODY=$(curl -sSL --max-time 30 "$URL" || true)
            if printf '%s' "$BODY" | grep -q '/MVP_SUPPLAI/assets/index-.*\.js'; then
              echo "OK — serving the built bundle:"
              printf '%s' "$BODY" | grep -o '/MVP_SUPPLAI/assets/[^"]*'
              exit 0
            fi
            echo "attempt $i: not the built app yet, waiting..."
            sleep 20
          done
          echo "::error::$URL is not serving the built app."
          echo "----- what it actually returns -----"
          printf '%s' "$BODY" | head -40
          echo "------------------------------------"
          echo "::error::Set Settings → Pages → Source to 'GitHub Actions'."
          exit 1
