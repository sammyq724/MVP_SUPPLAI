name: Deploy mockups to GitHub Pages

on:
  push:
    branches: [claude/b2b-distributor-order-ui-89h4aw]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published
# Pages site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
        env:
          # playwright is only used by the local screenshot harness; CI has no
          # need for ~400MB of browsers to build a static site.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on (source: GitHub Actions) if it isn't already, so the
          # site publishes without anyone flipping a settings toggle by hand.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
